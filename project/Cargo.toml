[workspace]
resolver = "3"
members = [
    # Libs
    "crates/graph-core",
    # Binaries
    "crates/logging-config",
    "crates/performance-experiments",
    "crates/memory-experiments",
    "crates/experiments-rq1",
    "crates/experiments-rq2",
    "crates/cli",
    "crates/demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rand = "0.10.3"
min-heap = "1.0.0"

# Data
polars = "0.55.2"

# Logger
log = "0.4.35"
env_logger = "0.11.11"
