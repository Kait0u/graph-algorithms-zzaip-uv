[workspace]
resolver = "3"
members = [
    "crates/graph-core",
    "crates/performance-experiments",
    "crates/memory-experiments",
    "crates/experiments-rq1",
    "crates/experiments-rq2",
    "crates/cli",
    "crates/demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
min-heap = "1.0.0"
polars = "0.55.2"
rand = "0.10.3"
